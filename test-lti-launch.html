<!DOCTYPE html>
<html>
<head>
    <title>SchoolApex LTI Test Launch</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .container { max-width: 600px; margin: 0 auto; }
        .button { 
            background: #0374B5; 
            color: white; 
            padding: 12px 24px; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer;
            font-size: 16px;
            margin: 10px 0;
        }
        .button:hover { background: #025a8a; }
        .info { background: #f5f5f5; padding: 20px; border-radius: 4px; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎓 SchoolApex LTI Test Launch</h1>
        
        <div class="info">
            <h3>Test LTI Integration</h3>
            <p>This page simulates an LTI launch from Canvas to test SchoolApex Modern UI.</p>
            <p><strong>Status:</strong> Ready to test</p>
        </div>

        <h3>🚀 Launch Options</h3>
        
        <button class="button" onclick="testDirectLaunch()">
            Test Direct Launch (Bypass Canvas)
        </button>
        
        <button class="button" onclick="testModernUI()">
            Open Modern UI Directly
        </button>
        
        <button class="button" onclick="testLTIService()">
            Test LTI Service Health
        </button>

        <div id="results" style="margin-top: 20px;"></div>
    </div>

    <script>
        function testDirectLaunch() {
            // Simulate LTI launch parameters
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = 'http://localhost:4001/lti/launch';
            
            // Add mock LTI parameters
            const params = {
                'iss': 'https://canvas.instructure.com',
                'aud': 'schoolapex_modern_ui',
                'sub': 'test-user-123',
                'https://purl.imsglobal.org/spec/lti/claim/message_type': 'LtiResourceLinkRequest',
                'https://purl.imsglobal.org/spec/lti/claim/version': '1.3.0',
                'https://purl.imsglobal.org/spec/lti/claim/context': JSON.stringify({
                    id: 'test-course-123',
                    label: 'Test Course',
                    title: 'Test Course for SchoolApex'
                }),
                'https://purl.imsglobal.org/spec/lti/claim/roles': JSON.stringify(['http://purl.imsglobal.org/vocab/lis/v2/membership#Instructor'])
            };
            
            Object.keys(params).forEach(key => {
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = key;
                input.value = params[key];
                form.appendChild(input);
            });
            
            document.body.appendChild(form);
            form.submit();
        }
        
        function testModernUI() {
            window.open('http://localhost:3001', '_blank');
        }
        
        async function testLTIService() {
            try {
                const response = await fetch('http://localhost:4001/health');
                const data = await response.json();
                document.getElementById('results').innerHTML = `
                    <div class="info">
                        <h4>✅ LTI Service Health Check</h4>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    </div>
                `;
            } catch (error) {
                document.getElementById('results').innerHTML = `
                    <div class="info" style="background: #ffebee;">
                        <h4>❌ LTI Service Error</h4>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
