<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"></noscript>
    <link rel="preload" href="/classapex_logo_light.png" as="image" type="image/png" media="(prefers-color-scheme: light)" />
    <link rel="preload" href="/classapex_logo_darkmode.png" as="image" type="image/png" media="(prefers-color-scheme: dark)" />
    <!-- Standard & High-Res Theme-Aware Favicons for modern browsers -->
    <link rel="icon" type="image/png" sizes="64x64" id="cx-favicon" href="/favicon-light.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-light.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-light.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-light.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClassApex — Learning Management System</title>
    <meta name="description" content="Modern, intuitive LMS powered by Carbon Design System with real-time Canvas data integration" />
    <style>
      body {
        margin: 0;
        background-color: #090d16;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        transition: background-color 0.2s ease;
      }
      
      #root {
        min-height: 100vh;
      }
      
      .loading-screen {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #090d16 0%, #111827 100%);
        box-sizing: border-box;
      }
      
      .loading-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
        max-width: 200px;
        width: 100%;
      }
      
      .loading-logo-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 48px;
        width: 48px;
        overflow: visible;
        position: relative;
      }
      
      .loading-logo-img {
        height: 100%;
        width: 100%;
        object-fit: contain;
        animation: breathe 2.5s ease-in-out infinite;
        filter: drop-shadow(0 0 16px rgba(99, 102, 241, 0.3));
      }
      
      .loading-logo-dark {
        background-color: transparent;
      }
      
      .loading-logo-light-img {
        display: none;
      }
      
      .loading-logo-dark-img {
        display: block;
      }
      
      .loading-ring {
        position: absolute;
        top: -4px; left: -4px;
        width: calc(100% + 8px); height: calc(100% + 8px);
        border-radius: 50%;
        border: 3px solid rgba(99,102,241,0.15);
        border-top-color: #6366f1;
        border-right-color: #6366f1;
        animation: spin 0.8s linear infinite;
      }
      
      @keyframes breathe {
        0%, 100% { transform: scale(0.96); opacity: 0.75; }
        50%      { transform: scale(1.02); opacity: 1; }
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      /* Light mode overrides for browsers that prefer light color scheme */
      @media (prefers-color-scheme: light) {
        body {
          background-color: #f8fafc;
        }
        .loading-screen {
          background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
        }
        .loading-logo-light-img {
          display: block;
        }
        .loading-logo-dark-img {
          display: none;
        }
        .loading-ring {
          border-color: rgba(79,70,229,0.15);
          border-top-color: #4f46e5;
          border-right-color: #4f46e5;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading-screen">
        <div class="loading-container">
          <div class="loading-logo-wrap loading-logo-light-img">
            <img src="/classapex_logo_light.png" alt="ClassApex" class="loading-logo-img" fetchpriority="high" decoding="sync" />
            <div class="loading-ring"></div>
          </div>
          <div class="loading-logo-wrap loading-logo-dark loading-logo-dark-img">
            <img src="/classapex_logo_darkmode.png" alt="ClassApex" class="loading-logo-img" fetchpriority="high" decoding="sync" />
            <div class="loading-ring"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
