<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SchoolApex LMS - Revolutionary Learning Management System</title>
    <meta name="description" content="Modern, intuitive LMS powered by Carbon Design System with real-time Canvas data integration" />
    <style>
      body {
        margin: 0;
        font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #f4f4f4;
      }
      
      #root {
        min-height: 100vh;
      }
      
      .loading-screen {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #090d16 0%, #111827 100%);
        color: white;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
      }
      
      .loading-container {
        max-width: 480px;
        width: 100%;
      }
      
      .loading-logo {
        font-size: clamp(1.8rem, 5vw, 2.5rem);
        margin: 0 0 16px 0;
        font-weight: 700;
        letter-spacing: -0.03em;
        background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      
      .loading-text {
        font-size: clamp(0.9rem, 3vw, 1.1rem);
        color: #9ca3af;
        margin: 0 0 32px 0;
        font-weight: 400;
      }

      .loading-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(139, 92, 246, 0.1);
        border-radius: 50%;
        border-top-color: #8b5cf6;
        margin: 0 auto;
        animation: spin 1s ease-in-out infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading-screen">
        <div class="loading-container">
          <h1 class="loading-logo">🎓 SchoolApex LMS</h1>
          <p class="loading-text">Loading revolutionary learning experience...</p>
          <div class="loading-spinner"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
