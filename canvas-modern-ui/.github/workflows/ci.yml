name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8
          
      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint --if-present
        
      - name: Type Check
        run: pnpm run type-check --if-present

      - name: Test Component Library
        run: pnpm --filter @schoolapex/components run test
        
      - name: Test LMS App
        run: pnpm --filter @classapex/lms-frontend run test
        
      - name: Build Storybook
        run: pnpm --filter @schoolapex/components run storybook:build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: test-and-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - uses: pnpm/action-setup@v3
        with:
          version: 8
      - run: pnpm install
      - run: npx playwright install --with-deps chromium
      - run: pnpm run test:e2e

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: test-and-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - uses: pnpm/action-setup@v3
        with:
          version: 8
      - run: pnpm install
      - name: Build Apps
        run: pnpm run build
      - name: Run Lighthouse CI
        run: npx @lhci/cli autorun
